<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Octoink Studios</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 8rem; margin: 0; color: #7c3aed; }
        h2 { font-size: 2rem; margin-bottom: 2rem; }
        p { color: #94a3b8; margin-bottom: 2rem; max-width: 400px; }
        .btn {
            background-color: #7c3aed;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn">Return Home</a>
    <script>
        // If they were trying to access dashboard, redirect to dashboard root
        if (window.location.pathname.startsWith('/dashboard')) {
            setTimeout(() => {
                window.location.href = '/dashboard/';
            }, 3000);
            document.querySelector('p').innerHTML += '<br><br>Redirecting to Dashboard in 3 seconds...';
        }
    </script>
</body>
</html>
